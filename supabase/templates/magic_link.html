<h2>Luv3 로그인</h2>
<p>아래 버튼을 누르면 로그인됩니다.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">로그인하기</a></p>
<p>메일 앱 안에서 열려 로그인이 안 되면, 로그인 화면에 아래 6자리 코드를 입력하세요.</p>
<p style="font-size:24px;letter-spacing:4px"><strong>{{ .Token }}</strong></p>
<p>요청하지 않았다면 이 메일은 무시해도 됩니다.</p>
