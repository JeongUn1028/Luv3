name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # main은 머지마다 두 기기 전체 E2E를 도는 유일한 실행이라, 다음 머지가 와도 취소하지 않는다(#194)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    # 평소 1~2분. 멈추면 기본 6시간 동안 러너와 필수 검사를 잡으므로 넉넉히 끊는다(#241)
    timeout-minutes: 10
    env:
      # 빌드 시 환경 변수 검증만 통과하면 되므로 로컬 Supabase 주소와 더미 키를 쓴다
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:coverage
      - run: pnpm build

  database:
    name: test:db (pgTAP RLS)
    runs-on: ubuntu-latest
    # 평소 1.5분
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # RLS 테스트가 auth·storage 스키마를 쓰므로 gotrue·storage-api는 띄우고 나머지는 뺀다
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      # 마이그레이션을 고치고 pnpm db:types를 잊으면 앱 코드가 옛 DB 모양을 믿어도 타입 검사가 통과하므로,
      # 마이그레이션만으로 만든 이 DB에서 타입을 다시 만들어 저장된 파일과 견준다. 다르면 차이를 출력하고 실패한다(#256)
      - name: DB 타입 파일 확인(다르면 로컬에서 pnpm db:types 실행 뒤 커밋)
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
      # 타입 차이가 있어도 pgTAP는 돌려, 두 실패를 한 번의 실행에서 함께 본다
      - run: pnpm test:db
        if: ${{ !cancelled() }}

  e2e-shard:
    # 450개 가까운 E2E를 한 대에서 둘씩 돌리면 PR에서 9~10분이 걸려, 스펙 파일 단위로 3대에 나눠 동시에 돌린다(#238)
    # 대마다 로컬 Supabase를 따로 띄우므로 서로의 데이터를 건드리지 않는다
    name: test:e2e (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    # 평소 PR 4~5분, main(두 기기 전체) 4.5~5.5분. Playwright는 10분(globalTimeout)에 먼저 끝나 보고서를 남긴다
    timeout-minutes: 15
    strategy:
      # 한 대가 실패해도 나머지를 끝까지 돌려 실패를 한 번에 본다
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    env:
      # PR에서는 아이폰 17에서 크기를 재는 스펙만 돌리고, main에 머지될 때 두 기기 전체를 돌린다(e2e/support/devices.ts)
      E2E_ALL_DEVICES: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 로그인·기록·사진을 쓰므로 gotrue·storage-api는 띄우고 나머지는 뺀다
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # 어느 대의 보고서인지 이름으로 바로 찾게 대 번호를 붙인다
          name: playwright-report-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    # main 보호의 필수 상태 검사는 잡 이름 test:e2e로 등록돼 있다. 나눈 잡은 이름이 달라지므로 이 잡이 결과를 모아 그 이름으로 알린다
    name: test:e2e
    needs: e2e-shard
    # 건너뛴 잡은 필수 검사에서 통과로 쳐지므로, 나눈 잡이 실패하거나 취소돼도 이 잡은 돌아서 실패로 끝나야 한다
    # !cancelled()는 실행을 손으로 취소하면 이 잡을 건너뛰어 E2E 없이 머지될 수 있어 always()를 쓴다
    if: always()
    runs-on: ubuntu-latest
    # 결과만 확인해 몇 초면 끝나지만, 러너 준비가 느린 날에도 통과한 PR을 막지 않게 여유를 둔다
    timeout-minutes: 5
    steps:
      - name: 나눈 잡이 모두 통과했는지 확인
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "나눈 잡 결과: $SHARD_RESULT"
          test "$SHARD_RESULT" = success
