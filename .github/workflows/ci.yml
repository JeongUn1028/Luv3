name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # main은 머지마다 두 기기 전체 E2E를 도는 유일한 실행이라, 다음 머지가 와도 취소하지 않는다(#194)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    env:
      # 빌드 시 환경 변수 검증만 통과하면 되므로 로컬 Supabase 주소와 더미 키를 쓴다
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

  database:
    name: test:db (pgTAP RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # RLS 테스트가 auth·storage 스키마를 쓰므로 gotrue·storage-api는 띄우고 나머지는 뺀다
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm test:db

  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    env:
      # PR에서는 아이폰 17에서 크기를 재는 스펙만 돌리고, main에 머지될 때 두 기기 전체를 돌린다(e2e/support/devices.ts)
      E2E_ALL_DEVICES: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 로그인·기록·사진을 쓰므로 gotrue·storage-api는 띄우고 나머지는 뺀다
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
