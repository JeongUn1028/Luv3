name: 운영 DB 반영 확인

# 필수 검사라서 paths로 거르면 안 된다. 마이그레이션이 없는 PR에 결과가 오지 않아 머지가 영영 막힌다
on:
  pull_request:
    # 본문에 체크만 해도 다시 확인하도록 edited를 넣는다. ci.yml과 나눈 것은 본문을 고칠 때마다 전체 검사가 돌지 않게 하기 위해서다
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: db-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: 운영 DB 반영 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/db-apply/check.mts
        env:
          GITHUB_TOKEN: ${{ github.token }}
