name: 저장 공간·사진 정리 점검

# Supabase 무료 저장 용량(1GB)에 다가가도, 주인 없는 사진 정리(Vercel Cron, 매달 1일)가 실패하거나 멈춰도 알려 주는 것이 없었다(#310).
# 매달 1일 정리가 끝난 뒤 미리 보기(지우지 않음)를 불러, 사용량이 80%를 넘거나 정리가 멈추는 상태(reason)이거나
# 지난 1일 정리가 지웠어야 할 파일·휴지통 사진이 남아 있으면 실패로 끝내 GitHub이 메일을 보낸다. 판단은 scripts/storage-check/lib.mts가 한다.
# 예약 실행의 실패 메일은 이 파일의 schedule을 마지막으로 고친 계정에 간다(실행 기록의 실행한 계정으로 확인한다).
# 공개 리포는 60일 동안 활동이 없으면 GitHub이 예약을 끈다. 월 1회 점검에서 켜져 있는지 본다(README).
on:
  schedule:
    # Vercel Cron(`0 4 1 * *`)은 UTC 4시대 안에 아무 때나 돈다. 그 뒤인 UTC 5시 23분(한국 시간 오후 2시 23분)에 본다.
    # 정각은 GitHub 예약이 몰려 늦거나 빠지기 쉬워 피한다. 예약이 늦어도 판단 기준은 지난 정리 예약 시각이라 괜찮다
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 저장 공간·사진 정리 점검
    runs-on: ubuntu-latest
    # curl은 60초씩 네 번까지(사이 10초) 부를 수 있어 4분 30초가 걸릴 수 있다. 체크아웃·Node 준비까지 넉넉히 둔다
    timeout-minutes: 8
    env:
      # 운영 주소(docs/plan.md의 도메인 결정). 바꾸면 keepalive.yml·keep-warm.yml과 함께 고친다.
      # preview가 있어야 지우지 않는다. 빼면 PHOTO_CLEANUP_DELETE가 켜진 운영에서 바로 지운다
      CLEANUP_PREVIEW_URL: https://luv3.vercel.app/api/photo-cleanup?preview=1
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: 비밀 값 확인
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::저장소 비밀 값 CRON_SECRET이 없습니다. Vercel의 CRON_SECRET과 같은 값을 Settings > Secrets and variables > Actions에 넣어 주세요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 정리 미리 보기 부르기
        id: preview
        # 버킷 전체 목록을 읽어 평소보다 오래 걸릴 수 있어 응답은 60초까지 기다리고, 연결이 안 되면 세 번까지 다시 시도한다.
        # 미리 보기는 지우지 않아 다시 불러도 안전하다
        run: |
          rm -f response.json
          curl_exit=0
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --retry 3 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" "$CLEANUP_PREVIEW_URL") || curl_exit=$?
          if [ "$curl_exit" != "0" ]; then
            echo "::error::운영 주소에서 응답을 받지 못했습니다(curl 종료 코드 $curl_exit: 6 주소 찾기 실패, 7 연결 거부, 28 시간 초과, 35 암호화 연결 실패). Vercel 배포와 CLEANUP_PREVIEW_URL을 확인해 주세요."
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: 응답 판단
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/storage-check/check.mts response.json "${{ steps.preview.outputs.status }}"
