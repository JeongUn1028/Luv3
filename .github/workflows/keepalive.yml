name: keepalive 확인

# Vercel Cron이 부르는 /api/keepalive가 실패해도 Hobby 로그는 1시간 뒤 사라지고 알림이 없다(#167).
# 하루 한 번 같은 경로를 따로 불러, 실패하면 이 작업이 실패해 GitHub이 저장소 주인에게 메일을 보낸다.
# 예약 작업의 실패 메일은 이 파일의 schedule을 마지막으로 고친 사람에게 간다.
on:
  schedule:
    # Vercel Cron(UTC 3시대)과 시간을 떨어뜨려, 한쪽이 멈춰도 다른 쪽이 7일 일시정지를 막는다. 한국 시간 밤 9시
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    name: keepalive 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 운영 주소(docs/plan.md의 도메인 결정). 바꾸면 여기도 고친다
      KEEPALIVE_URL: https://luv3.vercel.app/api/keepalive
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: 비밀 값 확인
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::저장소 비밀 값 CRON_SECRET이 없습니다. Vercel의 CRON_SECRET과 같은 값을 Settings > Secrets and variables > Actions에 넣어 주세요."
            exit 1
          fi
      - name: keepalive 부르기
        # 서버가 쉬다 깨어나거나 잠깐 끊길 수 있어 세 번까지 다시 시도한다. 응답 본문은 원인을 보려고 남긴다
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" "$KEEPALIVE_URL") || status="연결 실패"
          echo "응답: $status $(cat response.json 2>/dev/null)"
          if [ "$status" != "200" ]; then
            echo "::error::keepalive가 실패했습니다($status). 401이면 CRON_SECRET이 Vercel 값과 다르고, 502면 Supabase를 깨우지 못한 것입니다(README의 '프로젝트가 일시정지됐을 때')."
            exit 1
          fi
